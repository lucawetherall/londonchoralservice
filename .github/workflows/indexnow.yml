name: IndexNow ping

# Submits every sitemap URL to IndexNow (Bing/Yandex) after each GitHub Pages
# deploy, so new and edited pages reach Bing's index fast — Bing grounds
# ChatGPT browsing and other AI assistants' search. See
# MANUAL-ACTIONS-REQUIRED.md §7. The key file at the repo root is public by
# design; no secrets are involved.
#
# deploy-pages.yml calls this after every successful deploy. page_build fires
# only when Pages deploys straight from a branch (the set-up before
# 2026-09-27); it stays so that a rollback to that mode keeps pinging.

on:
  workflow_call:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/indexnow-ping.py
