  <!-- Google Analytics (GA4) and Google Ads — Consent Mode v2, deferred until after load.
       Source of truth: partials/analytics.html. The consent banner lives in js/consent.js. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });
    gtag('set', 'ads_data_redaction', true);
    try {
      if (localStorage.getItem('lcs-consent') === 'granted') {
        gtag('consent', 'update', {
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'denied',
          'analytics_storage': 'granted'
        });
      }
    } catch (e) {}
    function loadGA() {
      if (loadGA.done) return;
      loadGA.done = true;
      // The owner's own devices: open any page once with ?lcs_internal=1 (=0 to
      // undo) and GA4 tags the traffic as internal, which its filter excludes.
      var internal = false;
      try {
        var flag = new URLSearchParams(location.search).get('lcs_internal');
        if (flag === '1') localStorage.setItem('lcs-internal', '1');
        if (flag === '0') localStorage.removeItem('lcs-internal');
        internal = localStorage.getItem('lcs-internal') === '1';
      } catch (e) {}
      // Only the live site reports: local previews and test copies queue events
      // in dataLayer but never load gtag.js, so tests can't reach GA4 or Ads.
      if (!/(^|\.)londonchoralservice\.com$/.test(location.hostname)) return;
      gtag('js', new Date());
      gtag('config', 'G-9FENN7VS0E', internal ? { 'traffic_type': 'internal' } : {});
      gtag('config', 'AW-17988388404', { 'allow_enhanced_conversions': true });
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9FENN7VS0E';
      document.head.appendChild(s);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGA, { timeout: 3000 });
    } else {
      window.addEventListener('load', function() { setTimeout(loadGA, 100); });
    }
    if (/[?&](gclid|gbraid|wbraid)=/.test(location.search)) loadGA();
    ['scroll', 'click', 'touchstart', 'keydown'].forEach(function(evt) {
      window.addEventListener(evt, loadGA, { once: true, passive: true });
    });

    // Conversion tracking. A lead is one "Submit lead form" conversion plus a GA4
    // generate_lead, started by js/form.js and js/private-events.js only after
    // Web3Forms accepts the enquiry. With cookie consent, js/form.js's lead is
    // sent from thank-you.html (lcsLead below hands it over); without consent,
    // and on the private register's inline success, it goes from the form's own
    // page at once. Phone, email and WhatsApp taps are contact_click events, never
    // leads, each with its own Ads action: "WhatsApp or email click" is a
    // primary goal (owner decision, 26 Sep 2026) and "Call click" a secondary
    // one. Labels come from Google Ads (conversion action tag snippets).
    var LCS_ADS = {
      lead: 'AW-17988388404/RjhECKGP7akcELSMxIFD',
      call: 'AW-17988388404/HHu8CJq1x4UdELSMxIFD',
      message: 'AW-17988388404/5H_QCJ21x4UdELSMxIFD'
    };
    // done: a page change follows (js/form.js goes to the thank-you page). With
    // cookie consent the lead is handed to that page in sessionStorage and sent
    // from there, so the redirect can never cut its hits off before gtag.js has
    // sent them. Without consent nothing is stored and it goes at once, as a
    // cookieless ping.
    function lcsLead(detail, done) {
      var lead = {
        id: 'lead-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        source: detail.source,
        occasion: detail.occasion || 'unspecified'
      };
      // The cookie-free counter's event goes from here, once per accepted
      // enquiry with or without consent (a beacon, so the redirect can't cut it
      // off); lcsSendLead on the next page would find js/counter.js not loaded.
      if (typeof window.lcsCount === 'function') window.lcsCount('enquiry-sent-form');
      // Enhanced conversions: gtag hashes these (SHA-256) before sending, and
      // sends nothing at all unless the visitor allowed ad measurement.
      var ud = {};
      var email = (detail.email || '').trim().toLowerCase();
      if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) ud.email = email;
      var phone = (detail.phone || '').replace(/[^\d+]/g, '');
      if (/^0\d{9,10}$/.test(phone)) phone = '+44' + phone.slice(1);
      else if (/^44\d{9,10}$/.test(phone)) phone = '+' + phone;
      if (/^\+\d{10,15}$/.test(phone)) ud.phone_number = phone;
      if (done) {
        try {
          if (localStorage.getItem('lcs-consent') === 'granted') {
            sessionStorage.setItem('lcs-lead', JSON.stringify({ lead: lead, ud: ud }));
            done();
            return;
          }
        } catch (e) {}
      }
      lcsSendLead(lead, ud, done);
    }
    function lcsSendLead(lead, ud, done) {
      var finished = false;
      function finish() { if (!finished) { finished = true; if (done) done(); } }
      loadGA();
      if (ud.email || ud.phone_number) gtag('set', 'user_data', ud);
      gtag('event', 'generate_lead', {
        'currency': 'GBP',
        'value': 1,
        'lead_source': lead.source,
        'occasion': lead.occasion
      });
      // transaction_id: Google Ads counts one conversion per ID, however often it arrives.
      gtag('event', 'conversion', {
        'send_to': LCS_ADS.lead,
        'value': 1,
        'currency': 'GBP',
        'transaction_id': lead.id,
        'event_callback': finish
      });
      // Never hold the visitor up if gtag.js is blocked or slow.
      setTimeout(finish, 1500);
    }
    // The page after the form sends a lead handed to it, once: it is removed
    // before sending, so a refresh or the back button never counts it again.
    (function() {
      var saved = null;
      try {
        saved = JSON.parse(sessionStorage.getItem('lcs-lead') || 'null');
        sessionStorage.removeItem('lcs-lead');
      } catch (e) {}
      if (saved && saved.lead && saved.lead.id) lcsSendLead(saved.lead, saved.ud || {});
    })();
    // WhatsApp messages and emails carry the page they came from (and "via a
    // Google ad" when known), so each message shows its source. The visitor sees
    // the text and can change it before sending.
    // Four characters from a 32-bit FNV-1a hash of the click ID, in an alphabet
    // without 0/O or 1/I. scripts/ads/lookup_ref.py computes the same value.
    function lcsShortRef(id) {
      if (!id) return '';
      var h = 0x811c9dc5;
      for (var i = 0; i < id.length; i++) {
        h ^= id.charCodeAt(i) & 0xff;
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';
      for (var j = 0; j < 4; j++) { out += abc[h & 31]; h >>>= 5; }
      return out;
    }
    function lcsLabelMessage(a, method) {
      try {
        var original = a.getAttribute('data-lcs-href') || a.getAttribute('href');
        a.setAttribute('data-lcs-href', original);
        var h1 = document.querySelector('h1');
        var page = ((h1 && h1.childNodes[0] && h1.childNodes[0].textContent) || document.title.split('|')[0]).replace(/\s+/g, ' ').trim();
        var attr = lcsAttribution();
        var ad = attr.gclid || attr.gbraid || attr.wbraid || attr.utm_medium === 'cpc' || lcsAdVisit() ? ', via a Google ad' : '';
        var source = 'your \u201c' + page + '\u201d page' + ad;
        // With cookie consent, a short reference to the ad click rides along too,
        // so a booking that starts on WhatsApp or email can be reported to Google
        // Ads: scripts/ads/lookup_ref.py finds the click whose ID gives this ref.
        var ref = '';
        try {
          if (localStorage.getItem('lcs-consent') === 'granted') {
            ref = lcsShortRef(attr.gclid || attr.gbraid || attr.wbraid || '');
          }
        } catch (e) {}
        // Without consent, only the landing page's name and the ad's campaign
        // (never the click ID).
        var visit = ref ? '' : lcsAdVisit();
        var tag = ref ? 'Ref: ' + ref : visit ? 'Ad visit: ' + visit : '';
        if (method === 'whatsapp') {
          var url = new URL(original);
          var text = url.searchParams.get('text') || 'Hello, I\u2019d like to ask about a booking.';
          a.setAttribute('href', original.split('?')[0] + '?text=' + encodeURIComponent(text + ' (Sent from ' + source + '.' + (tag ? ' ' + tag : '') + ')'));
        } else if (original.indexOf('?') === -1) {
          a.setAttribute('href', original + '?subject=' + encodeURIComponent('Enquiry from ' + source) +
            (tag ? '&body=' + encodeURIComponent('\r\n\r\n\r\n' + tag) : ''));
        }
      } catch (e) {}
    }
    document.addEventListener('click', function(e) {
      var a = e.target.closest && e.target.closest('a[href^="tel:"], a[href^="mailto:"], a[href*="wa.me/"]');
      if (!a) return;
      var href = a.getAttribute('href');
      var method = href.indexOf('tel:') === 0 ? 'call' : href.indexOf('mailto:') === 0 ? 'email' : 'whatsapp';
      var where = a.closest('.mobile-cta') ? 'mobile_bar' : a.closest('.site-footer') ? 'footer' :
        a.closest('.site-header') ? 'header' : 'body';
      if (method !== 'call') lcsLabelMessage(a, method);
      loadGA();
      gtag('event', 'contact_click', { 'method': method, 'link_location': where });
      var label = method === 'call' ? LCS_ADS.call : LCS_ADS.message;
      if (label) gtag('event', 'conversion', { 'send_to': label, 'value': 1, 'currency': 'GBP' });
    });

    // Ad click ID and UTM tags from the landing URL, kept for this tab (only once
    // the visitor has allowed cookies) so an enquiry sent from a later page still
    // carries its source for offline conversion import.
    var LCS_ATTR_KEYS = ['gclid', 'gbraid', 'wbraid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
    function lcsAttribution() {
      var out = {};
      try {
        var saved = JSON.parse(sessionStorage.getItem('lcs-attr') || '{}');
        var q = new URLSearchParams(location.search);
        LCS_ATTR_KEYS.forEach(function(k) { var v = q.get(k) || saved[k]; if (v) out[k] = v; });
      } catch (e) {}
      return out;
    }
    function lcsKeepAttribution() {
      try {
        if (localStorage.getItem('lcs-consent') !== 'granted') return;
        var a = lcsAttribution();
        if (Object.keys(a).length) sessionStorage.setItem('lcs-attr', JSON.stringify(a));
      } catch (e) {}
    }
    lcsKeepAttribution();

    // Ad visit without cookies: when this page's own URL holds an ad click ID
    // and the visitor has not allowed cookies, its messages and form carry the
    // landing page's name and the ad's campaign from utm_campaign ("Ad visit:
    // pricing (wedding-leads)"), never the click ID. Nothing is stored: the
    // label lives in this variable, and same-site links on the page carry it in
    // their address (lcs_av=<label>), so the next page the visitor opens knows
    // it too and passes it on. scripts/bookings/pipeline.py reads the same format.
    function lcsAdVisitSlug(path) {
      var p = String(path || '').toLowerCase().replace(/^\/+/, '').replace(/\.html$/, '').replace(/(^|\/)index$/, '').replace(/\/+$/, '');
      if (!p) return 'home';
      return p.length <= 80 && /^[a-z0-9-]+(\/[a-z0-9-]+)*$/.test(p) ? p : 'other';
    }
    function lcsAdVisitLabel() {
      try {
        var q = new URLSearchParams(location.search);
        if (/[?&](gclid|gbraid|wbraid)=[^&]/.test(location.search)) {
          var slug = lcsAdVisitSlug(location.pathname), campaign = q.get('utm_campaign') || '';
          return /^[a-z0-9-]{1,40}$/.test(campaign) ? slug + ' (' + campaign + ')' : slug;
        }
        // Carried from the previous page, and only from a page of this site, so
        // a shared or bookmarked address never counts as an ad visit.
        var carried = q.get('lcs_av') || '';
        var from = document.referrer ? new URL(document.referrer).origin : '';
        // The page at most 80 characters, the campaign at most 40 (as pipeline.py's AD_VISIT_RE).
        if (from === location.origin &&
            /^(?=[a-z0-9\/-]{1,80}( \(|$))[a-z0-9-]+(\/[a-z0-9-]+)*( \([a-z0-9-]{1,40}\))?$/.test(carried)) return carried;
      } catch (e) {}
      return '';
    }
    var LCS_AD_VISIT = lcsAdVisitLabel();
    function lcsAdVisit() {
      if (!LCS_AD_VISIT) return '';
      // Once cookies are allowed the click reference (lcsAttribution) takes over, but only if there is one: a
      // visitor who accepts on a later page has no click ID left, so the label stays.
      try {
        if (localStorage.getItem('lcs-consent') === 'granted') {
          var a = lcsAttribution();
          if (a.gclid || a.gbraid || a.wbraid) return '';
        }
      } catch (e) {}
      return LCS_AD_VISIT;
    }
    // Same-site page links (.html or folder addresses) get lcs_av=<label> at
    // run time, for ad visitors only, so crawlers never see it. Never tel:,
    // mailto:, WhatsApp, other sites or links within the page. Once the visitor
    // allows cookies the label comes off again where a click ID remains
    // (lcsAttribution takes over); after accepting on a later page it stays.
    function lcsCarryAdVisit(a) {
      try {
        var raw = a.getAttribute('href') || '';
        if (!raw || raw.charAt(0) === '#' || /^(tel|mailto|sms|javascript):/i.test(raw) ||
            raw.indexOf('wa.me/') !== -1 || a.hasAttribute('download')) return;
        var url = new URL(raw, location.href);
        if (url.origin !== location.origin || !/(\.html|\/)$/.test(url.pathname)) return;
        var visit = lcsAdVisit();
        if (visit) url.searchParams.set('lcs_av', visit);
        else if (url.searchParams.has('lcs_av')) url.searchParams.delete('lcs_av');
        else return;
        a.setAttribute('href', url.pathname + url.search + url.hash);
      } catch (e) {}
    }
    if (LCS_AD_VISIT) {
      var lcsCarryAll = function() {
        if (lcsAdVisit()) Array.prototype.forEach.call(document.querySelectorAll('a[href]'), lcsCarryAdVisit);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lcsCarryAll);
      else lcsCarryAll();
      // Links added later, and a choice made on the cookie sheet since, are
      // settled as each link is used.
      ['click', 'auxclick', 'contextmenu'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
          var a = e.target.closest && e.target.closest('a[href]');
          if (a) lcsCarryAdVisit(a);
        }, true);
      });
    }
    // The click IDs in this page's own URL, for an enquiry whose sender ticked
    // the form's ad-measurement box (read at submit, never stored).
    function lcsClickIds() {
      var out = {};
      try {
        var q = new URLSearchParams(location.search);
        ['gclid', 'gbraid', 'wbraid'].forEach(function(k) { var v = q.get(k); if (v) out[k] = v; });
      } catch (e) {}
      return out;
    }
  </script>
  <script src="/js/consent.js" defer></script>
  <!-- Cookie-free visit counter (GoatCounter; privacy.html#visit-counter). Off
       while LCS_COUNTER is empty: then no page loads anything for it. To switch
       it on, put the GoatCounter site code between the quotes and run
       ./build.sh. js/counter.js does the counting. -->
  <script>
    var LCS_COUNTER = 'londonchoralservice';
    if (LCS_COUNTER) {
      var lcsCounterJs = document.createElement('script');
      lcsCounterJs.src = '/js/counter.js';
      document.head.appendChild(lcsCounterJs);
    }
  </script>
