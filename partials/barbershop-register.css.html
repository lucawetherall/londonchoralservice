  <style>
    /* Barbershop register — bespoke scoped styles for barbershop-grams/ and
       compare/barbershopogram.html. NOT the generated site bundle.
       Never replace this block with the site's generated CSS bundle: the first
       inner line of this block being a comment is what stops build.sh Pass A
       from converting it. A page carrying this partial must never also link the
       generated site stylesheet: Pass B would inline the whole site bundle on top.
       See docs/superpowers/specs/2026-09-03-barbershop-grams-design.md */
    /* ── Self-hosted fonts (latin subset) — copied verbatim from css/base.css ── */
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 300 600;
      font-display: swap;
      src: url('/fonts/cormorant-garamond.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/cormorant-garamond-italic.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/source-serif-4.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/source-serif-4-italic.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ── Page tokens (gift register) ──
       COLOUR LAW (computed WCAG contrast):
                        on --bs-paper   on --bs-cream
         --bs-ink            16.13 AAA      14.29 AAA   body and headings
         --bs-navy           10.75 AAA       9.52 AAA   occasion labels, table heads
         --bs-red             6.12 AA        5.42 AA    accents, buttons, small caps — NOT long body text
         --bs-mid             5.85 AA        5.18 AA    captions, secondary text
       Reversed (paper on red, paper on navy) is symmetric: 6.12 and 10.75 — both fine for buttons.
       --bs-rule is a hairline only: never text, never a focus outline. */
    :root {
      --bs-ink:    #1F1A17;
      --bs-mid:    #6B5E56;
      --bs-red:    #B3261E;
      --bs-navy:   #1F3A5F;
      --bs-paper:  #FBF7EF;
      --bs-cream:  #F1E9DA;
      --bs-rule:   #DCD2C2;
      --font-display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
      --font-body:    'Source Serif 4', Georgia, 'Times New Roman', serif;
      --font-ui:      'Source Serif 4', Georgia, 'Times New Roman', serif;
    }

    /* ── Reset ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    img { max-width: 100%; display: block; }

    /* ── Base ── */
    html { background: var(--bs-paper); }
    body {
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.65;
      color: var(--bs-ink);
      background: var(--bs-paper);
    }

    /* ── Sections: bays down a nave ── */
    .bs-section {
      padding-block: clamp(4rem, 9vw, 7.5rem);
      border-top: 1px solid var(--bs-rule);
    }
    .bs-section--light { background: var(--bs-paper); }
    .bs-section--mid { background: var(--bs-cream); }
    .bs-hero { border-top: 0; }

    /* ── Rail grid ── */
    .bs-rail {
      display: grid;
      grid-template-columns: minmax(10rem, 14rem) minmax(0, 68ch);
      column-gap: clamp(2rem, 4vw, 3.5rem);
      row-gap: 1.5rem;
      max-width: 72rem;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
    }
    .bs-rail-label {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--bs-red);
      border-top: 1px solid var(--bs-rule);
      padding-top: 1rem;
    }
    @media (max-width: 47.9375rem) {
      .bs-rail { grid-template-columns: minmax(0, 1fr); row-gap: 1.25rem; }
    }

    /* ── Type scale ── */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5.5vw, 3.75rem);
      font-weight: 500;
      line-height: 1.15;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 2.125rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.25;
      margin-top: 2.5rem;
      margin-bottom: .75rem;
    }
    @media (max-width: 47.9375rem) {
      h2 { font-size: 1.6875rem; }
    }
    .bs-eyebrow {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--bs-red); /* same small-caps role as the rail labels */
    }
    .bs-pull {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 300;
      font-style: italic;
      line-height: 1.35;
      margin-top: 2.25rem;
      border-top: 1px solid var(--bs-rule);
      padding-top: 1.75rem;
    }
    .bs-caption {
      font-size: .875rem;
      color: var(--bs-mid);
    }
    .bs-body p + p { margin-top: 1.25rem; }
    .bs-body a {
      color: var(--bs-ink);
      text-decoration: underline;
      text-decoration-color: var(--bs-mid);
      text-underline-offset: .2em;
    }
    .bs-body a:hover { text-decoration-color: var(--bs-ink); }

    /* ── Skip link ── */
    .bs-skip-link {
      position: absolute;
      top: -3rem;
      left: 1.25rem;
      padding: .6rem 1.1rem;
      background: var(--bs-red);
      color: var(--bs-paper);
      font-family: var(--font-ui);
      font-size: .8125rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-decoration: none;
      z-index: 200;
      transition: top .2s;
    }
    .bs-skip-link:focus {
      top: 1rem;
      outline: 2px solid var(--bs-ink);
      outline-offset: 2px;
    }
    .bs-skip-link:visited { color: var(--bs-paper); }

    /* ── Header ── */
    .bs-header {
      background: var(--bs-paper);
      border-bottom: 1px solid var(--bs-rule);
    }
    .bs-nav {
      max-width: 72rem;
      margin-inline: auto;
      padding: 1.1rem clamp(1.25rem, 5vw, 3rem);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 1.25rem;
    }
    .bs-wordmark {
      font-family: var(--font-display);
      font-size: 1.3125rem;
      color: var(--bs-ink);
      text-decoration: none;
    }
    .bs-nav-enquire {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--bs-ink);
      text-decoration: none;
      border-bottom: 1px solid var(--bs-rule);
      padding-bottom: .2rem;
    }
    .bs-nav-enquire:hover { border-bottom-color: var(--bs-ink); }
    .bs-nav .bs-wordmark { margin-right: auto; }

    /* ── Breadcrumb (repertoire.html only; the hub has no trail) ── */
    .bs-breadcrumb {
      max-width: 72rem;
      margin-inline: auto;
      padding: 0 clamp(1.25rem, 5vw, 3rem) .9rem;
    }
    .bs-breadcrumb p {
      font-family: var(--font-ui);
      font-size: .75rem;
      letter-spacing: .04em;
      color: var(--bs-mid);
      margin: 0;
    }
    .bs-breadcrumb a { color: var(--bs-mid); text-decoration: none; border-bottom: 1px solid var(--bs-rule); }
    .bs-breadcrumb a:hover { color: var(--bs-ink); border-bottom-color: var(--bs-ink); }
    .bs-breadcrumb [aria-current="page"] { color: var(--bs-ink); }
    .bs-crumb-sep { color: var(--bs-mid); padding-inline: .45rem; }

    /* ── Checked-date stamp on time-sensitive facts ── */
    .bs-checked {
      font-family: var(--font-ui);
      font-size: .6875rem;
      letter-spacing: .04em;
      color: var(--bs-mid);
      border-left: 2px solid var(--bs-rule);
      padding-left: .75rem;
      margin-top: 1rem;
    }

    /* ── Hero ── */
    .bs-hero__inner {
      max-width: 72rem;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
    }
    .bs-hero h1 {
      max-width: 18ch;
      margin-top: 1.5rem;
    }
    .bs-hairline--accent {
      width: 5.5rem;
      height: 1px;
      background: var(--bs-navy);
      margin-block: 2rem;
    }
    .bs-hero__sub {
      max-width: 58ch;
      font-size: 1.1875rem;
      color: var(--bs-mid);
    }
    .bs-hero__cta {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 2.5rem;
    }

    /* ── Buttons ── */
    .bs-btn {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--bs-ink);
      background: transparent;
      border: 1px solid var(--bs-ink);
      padding: 1rem 1.75rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .bs-btn:hover {
      background: var(--bs-ink);
      color: var(--bs-paper);
    }

    /* ── Process: the page's only numbered component ── */
    .bs-process {
      list-style: none; /* role="list" in the markup keeps AT list semantics */
      margin-top: 1.75rem;
      display: grid;
      gap: 2rem;
    }
    .bs-process li {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      column-gap: 1.25rem;
    }
    .bs-process .n {
      grid-row: span 2;
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 300;
      line-height: 1;
      color: var(--bs-mid);
    }
    .bs-process h3 { margin: 0 0 .35rem; }
    .bs-process p { grid-column: 2; }

    /* ── Footer ── */
    .bs-footer {
      background: var(--bs-cream);
      border-top: 1px solid var(--bs-rule);
      padding: 3rem clamp(1.25rem, 5vw, 3rem);
      text-align: center;
      font-size: .875rem;
      color: var(--bs-mid);
    }
    .bs-footer a { color: var(--bs-mid); }
    .bs-footer p + p { margin-top: .75rem; }

    /* ── Occasion strip ── */
    .bs-occasions {
      display: flex;
      flex-wrap: wrap;
      gap: .625rem;
      list-style: none;
      margin-top: 2rem;
    }
    .bs-occasions a {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .8125rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--bs-navy);
      text-decoration: none;
      border: 1px solid var(--bs-rule);
      padding: .5rem 1rem;
      transition: border-color .2s, color .2s;
    }
    .bs-occasions a:hover { border-color: var(--bs-navy); }
    .bs-occasions .bs-occasions__lead a {
      color: var(--bs-paper);
      background: var(--bs-navy);
      border-color: var(--bs-navy);
    }

    /* ── Price table ── */
    .bs-prices {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }
    .bs-prices th {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--bs-navy);
      text-align: left;
      border-bottom: 1px solid var(--bs-rule);
      padding: 0 1rem .75rem 0;
    }
    .bs-prices td {
      border-bottom: 1px solid var(--bs-rule);
      padding: 1.125rem 1rem 1.125rem 0;
      vertical-align: top;
    }
    .bs-prices td:last-child {
      white-space: nowrap;
      text-align: right;
      padding-right: 0;
      font-variant-numeric: tabular-nums;
    }
    .bs-prices .bs-prices__flag {
      display: block;
      font-family: var(--font-ui);
      font-size: .6875rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--bs-red);
      margin-top: .35rem;
    }
    @media (max-width: 39.9375rem) {
      .bs-prices thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .bs-prices tr { display: block; border-bottom: 1px solid var(--bs-rule); padding-block: 1rem; }
      .bs-prices td { display: block; border: 0; padding: 0 0 .35rem 0; }
      .bs-prices td:last-child { text-align: left; font-weight: 600; }
    }

    /* ── Checklist ── */
    .bs-check { list-style: none; margin-top: 1.5rem; }
    .bs-check li {
      position: relative;
      padding-left: 1.75rem;
      margin-top: .875rem;
    }
    .bs-check li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .55em;
      width: .5rem;
      height: .5rem;
      border: 1px solid var(--bs-red);
    }

    /* ── FAQ ── */
    .bs-faq { margin-top: 1.5rem; }
    .bs-faq details {
      border-bottom: 1px solid var(--bs-rule);
      padding-block: 1.125rem;
    }
    .bs-faq summary {
      font-family: var(--font-display);
      font-size: 1.3125rem;
      cursor: pointer;
      list-style: none;
    }
    .bs-faq summary::-webkit-details-marker { display: none; }
    .bs-faq summary::after {
      content: "+";
      float: right;
      color: var(--bs-red);
      font-family: var(--font-ui);
    }
    .bs-faq details[open] summary::after { content: "\2013"; }
    .bs-faq details > p { margin-top: .875rem; }

    /* ── Repertoire groups ── */
    .bs-rep { columns: 2; column-gap: 2.5rem; list-style: none; margin-top: 1rem; }
    .bs-rep li { break-inside: avoid; padding-block: .28rem; }
    @media (max-width: 39.9375rem) { .bs-rep { columns: 1; } }

    /* ── Filled button variant, for the primary CTA ── */
    .bs-btn--fill {
      color: var(--bs-paper);
      background: var(--bs-ink);
      border-color: var(--bs-ink);
    }
    .bs-btn--fill:hover {
      background: var(--bs-red);
      border-color: var(--bs-red);
      color: var(--bs-paper);
    }


    /* ── Form (gift enquiry; the hub's #enquire section only) ──
       Recovered from partials/private-register.css.html, the file this
       register was cloned from, with the pe- prefix and the old token names
       repointed to the barbershop tokens above. ── */
    .bs-form { margin-top: 2.25rem; }
    .bs-field { margin-top: 1.75rem; }
    .bs-field > label {
      display: block;
      font-family: var(--font-ui);
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--bs-mid);
      margin-bottom: .5rem;
    }
    .bs-field input[type="text"],
    .bs-field input[type="email"],
    .bs-field input[type="tel"],
    .bs-field input[type="date"],
    .bs-field select,
    .bs-field textarea {
      display: block;
      width: 100%;
      font-family: var(--font-ui);
      font-size: 1rem;
      color: var(--bs-ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--bs-mid);
      border-radius: 0;
      padding: .55rem 0;
    }
    .bs-field textarea {
      border: 1px solid var(--bs-mid);
      padding: .75rem;
      resize: vertical;
    }
    .bs-field input:focus,
    .bs-field select:focus,
    .bs-field textarea:focus {
      border-color: var(--bs-ink);
    }
    /* Invalid state shows only after the visitor has interacted, and in the
       site feedback red rather than the register's decorative red. */
    .bs-field input:user-invalid,
    .bs-field select:user-invalid,
    .bs-field textarea:user-invalid {
      border-color: #9B2C2C;
    }
    .bs-field input:disabled,
    .bs-field select:disabled,
    .bs-field textarea:disabled {
      color: var(--bs-mid);
      border-bottom-style: dotted;
    }
    /* Help text under a field (the note beneath the message box). */
    .bs-field .bs-caption { margin-top: .5rem; }
    .bs-form .bs-btn { margin-top: 2.25rem; }
    .bs-form .bs-btn:disabled { cursor: default; opacity: .6; }

    /* ── Error / success (site feedback colours) ── */
    .bs-form-error {
      display: none;
      margin-top: 1.75rem;
      padding: 1rem 1.25rem;
      color: #9B2C2C;
      background: #FBEBE9;
      border: 1px solid #E0A8A8;
    }
    .bs-form-error[data-visible="true"] { display: block; }
    .h-captcha { margin-top: 2rem; }
    #bs-form-success {
      margin-top: 2.25rem;
      padding: 1rem 1.25rem;
      color: #2D5016;
      background: #E8F0E4;
      border: 1px solid #A8C99B;
    }
    /* Hidden via a class, not the `hidden` attribute — the no-JS :target
       reveal below only overrides CSS, so an element still carrying
       `hidden` would stay removed from the accessibility tree even once
       painted visible. */
    .bs-hidden { display: none; }
    /* No-JS fallback. The plain HTML POST hands Web3Forms a redirect back to
       this anchor, and Web3Forms only redirects on a send it accepted, so the
       confirmation shows with no script running and the buyer never leaves the
       register for main-site chrome. The JS path removes the class instead. */
    #bs-form-success.bs-hidden:target { display: block; }

    /* ── Focus & utilities ── */
    :focus-visible {
      outline: 2px solid var(--bs-red);
      outline-offset: 3px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Motion: no JS sets html.bs-motion on this mini-site, so there are
       no entrance-animation classes to gate here. The one live rule is
       smooth in-page scrolling, for the hub's occasion-strip anchors. ── */
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bs-btn, .bs-occasions a, .bs-skip-link { transition: none; }
    }
  </style>
