  <style>
    /* Private register — bespoke scoped styles shared by private-events.html,
       destinations/, and planners-and-venues.html. NOT the generated site bundle.
       Never replace this block with the site's generated CSS bundle: the first
       inner line of this block being a comment is what stops build.sh Pass A
       from converting it. A page carrying this partial must never also link the
       generated site stylesheet: Pass B would inline the whole site bundle on top.
       See docs/superpowers/specs/2026-08-26-private-events-design.md and
           docs/superpowers/specs/2026-08-29-international-luxury-weddings-design.md */
    /* ── Self-hosted fonts (latin subset) — copied verbatim from css/base.css ── */
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 300 600;
      font-display: swap;
      src: url('/fonts/cormorant-garamond.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/cormorant-garamond-italic.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/source-serif-4.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/source-serif-4-italic.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ── Page tokens (light register, from the print collateral) ──
       COLOUR LAW (computed contrast on parchmentLight/parchment):
       choirStall 15.91 AAA, organPipe 6.83 AA, cassockRed 9.59 AAA — the ONLY
       text colours. candle, limestone, naveStone fail (2.39–2.95): hairlines
       and decorative surfaces ONLY, never text, never focus outlines.
       cassockRed: at most four decorative uses + the focus outline. */
    :root {
      --choirStall: #2A1708;
      --cassockRed: #7E1818;
      --organPipe: #5F544A;
      --naveStone: #9A8F7F; /* reserved, decorative-only — fails contrast for text */
      --limestone: #C8BFA9;
      --parchment: #F0E9DC;
      --parchmentLight: #FAF6EE;
      --candle: #C89A3C;
      --font-display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
      --font-body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    /* ── Reset ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    img { max-width: 100%; display: block; }

    /* ── Base ── */
    html { background: var(--parchmentLight); }
    body {
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.65;
      color: var(--choirStall);
      background: var(--parchmentLight);
    }

    /* ── Sections: bays down a nave ── */
    .pe-section {
      padding-block: clamp(4rem, 9vw, 7.5rem);
      border-top: 1px solid var(--limestone);
    }
    .pe-section--light { background: var(--parchmentLight); }
    .pe-section--mid { background: var(--parchment); }
    .pe-hero { border-top: 0; }

    /* ── Rail grid ── */
    .pe-rail {
      display: grid;
      grid-template-columns: minmax(10rem, 14rem) minmax(0, 68ch);
      column-gap: clamp(2rem, 4vw, 3.5rem);
      row-gap: 1.5rem;
      max-width: 72rem;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
    }
    .pe-rail-label {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--cassockRed); /* cassockRed use 1 of 4: rail small-caps labels */
      border-top: 1px solid var(--limestone);
      padding-top: 1rem;
    }
    @media (max-width: 47.9375rem) {
      .pe-rail { grid-template-columns: minmax(0, 1fr); row-gap: 1.25rem; }
    }

    /* ── Type scale ── */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 7vw, 4.75rem);
      font-weight: 300;
      line-height: 1.15;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 2.125rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.25;
      margin-top: 2.5rem;
      margin-bottom: .75rem;
    }
    @media (max-width: 47.9375rem) {
      h2 { font-size: 1.6875rem; }
    }
    .pe-eyebrow {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--cassockRed); /* same small-caps role as the rail labels */
    }
    .pe-pull {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 300;
      font-style: italic;
      line-height: 1.35;
      margin-top: 2.25rem;
      border-top: 1px solid var(--limestone);
      padding-top: 1.75rem;
    }
    .pe-caption {
      font-size: .875rem;
      color: var(--organPipe);
    }
    .pe-body p + p { margin-top: 1.25rem; }
    .pe-body a {
      color: var(--choirStall);
      text-decoration: underline;
      text-decoration-color: var(--organPipe);
      text-underline-offset: .2em;
    }
    .pe-body a:hover { text-decoration-color: var(--choirStall); }

    /* ── Header ── */
    .pe-header {
      background: var(--parchmentLight);
      border-bottom: 1px solid var(--limestone);
    }
    .pe-nav {
      max-width: 72rem;
      margin-inline: auto;
      padding: 1.1rem clamp(1.25rem, 5vw, 3rem);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .pe-wordmark {
      font-family: var(--font-display);
      font-size: 1.3125rem;
      color: var(--choirStall);
      text-decoration: none;
    }
    .pe-nav-enquire {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--choirStall);
      text-decoration: none;
      border-bottom: 1px solid var(--limestone);
      padding-bottom: .2rem;
    }
    .pe-nav-enquire:hover { border-bottom-color: var(--choirStall); }

    /* ── Breadcrumb (destination pages only; the hub has no trail) ── */
    .pe-breadcrumb {
      max-width: 72rem;
      margin-inline: auto;
      padding: 0 clamp(1.25rem, 5vw, 3rem) .9rem;
    }
    .pe-breadcrumb p {
      font-family: var(--font-ui);
      font-size: .75rem;
      letter-spacing: .04em;
      color: var(--organPipe);
      margin: 0;
    }
    .pe-breadcrumb a { color: var(--organPipe); text-decoration: none; border-bottom: 1px solid var(--limestone); }
    .pe-breadcrumb a:hover { color: var(--choirStall); border-bottom-color: var(--choirStall); }
    .pe-breadcrumb [aria-current="page"] { color: var(--choirStall); }
    .pe-crumb-sep { color: var(--naveStone); padding-inline: .45rem; }

    /* ── Destination groups and cards ── */
    .pe-group + .pe-group { margin-top: 3rem; }
    .pe-group > h3 {
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cassockRed);
      margin-bottom: .9rem;
    }
    .pe-dests {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 1px;
      /* Cell rules come from each item's own ring rather than a container
         background showing through the gap: an odd-numbered group would
         otherwise leave the trailing empty cell as a solid block of colour. */
    }
    .pe-dests > li { box-shadow: 0 0 0 1px var(--limestone); }
    .pe-dests + p { margin-top: 1.75rem; }
    .pe-dests a {
      display: block;
      padding: 1.1rem 1.25rem 1.2rem;
      text-decoration: none;
      color: var(--choirStall);
      height: 100%;
    }
    .pe-dests a:hover { background: rgba(126, 24, 24, .045); }
    .pe-dests .n {
      display: block;
      font-family: var(--font-display);
      font-size: 1.375rem;
      line-height: 1.15;
    }
    .pe-dests .r {
      display: block;
      margin-top: .35rem;
      font-family: var(--font-body);
      font-size: .8125rem;
      line-height: 1.45;
      color: var(--organPipe);
    }

    /* ── Region sections within a country page ── */
    .pe-region { margin-top: 2.25rem; }
    .pe-region > h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      line-height: 1.2;
      margin-bottom: .5rem;
    }
    .pe-region > h3::after {
      content: "";
      display: block;
      width: 2.25rem;
      height: 1px;
      background: var(--candle);
      margin-top: .55rem;
    }

    /* ── Checked-date stamp on time-sensitive facts ── */
    .pe-checked {
      font-family: var(--font-ui);
      font-size: .6875rem;
      letter-spacing: .04em;
      color: var(--organPipe);
      border-left: 2px solid var(--limestone);
      padding-left: .75rem;
      margin-top: 1rem;
    }

    /* ── Hero ── */
    .pe-hero__inner {
      max-width: 72rem;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
    }
    .pe-hero h1 {
      max-width: 18ch;
      margin-top: 1.5rem;
    }
    .pe-hairline--candle {
      width: 5.5rem;
      height: 1px;
      background: var(--candle); /* decorative hairline only — never text */
      margin-block: 2rem;
    }
    .pe-hero__sub {
      max-width: 58ch;
      font-size: 1.1875rem;
      color: var(--organPipe);
    }
    .pe-hero__cta { margin-top: 2.5rem; }

    /* ── Buttons: outline only, never a candle fill ── */
    .pe-btn {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--choirStall);
      background: transparent;
      border: 1px solid var(--choirStall);
      padding: 1rem 1.75rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .pe-btn:hover {
      background: var(--choirStall);
      color: var(--parchmentLight);
    }

    /* ── Voicing selector ── */
    .pe-voicing {
      border: 0;
      min-inline-size: 0; /* lets the fieldset shrink inside the grid column */
    }
    .pe-voices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .75rem;
      margin-top: 1.75rem;
    }
    @media (max-width: 47.9375rem) {
      .pe-voices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .pe-voice-card {
      display: block;
      text-align: center;
      border: 1px solid var(--organPipe);
      padding: 1.1rem .75rem 1rem;
      cursor: pointer;
    }
    .pe-voice-card input {
      accent-color: var(--cassockRed); /* cassockRed use 2 of 4: checked controls */
    }
    .pe-voice-card:has(input:checked) {
      border-color: var(--cassockRed); /* cassockRed use 3 of 4: selected card rule */
      box-shadow: inset 0 0 0 1px var(--cassockRed);
    }
    .pe-voice-card__num {
      display: block;
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 400;
      line-height: 1.1;
      margin-top: .5rem;
    }
    .pe-voice-card__sub {
      display: block;
      font-family: var(--font-ui);
      font-size: .6875rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--organPipe);
      margin-top: .3rem;
    }
    #voicing-note {
      margin-top: 1.75rem;
      min-height: 6.5em;
    }
    @media (max-width: 40rem) {
      #voicing-note { min-height: 8.5em; }
    }

    /* ── Voicing media: click-to-load video (site pattern, restyled) ── */
    #voicing-media:not(:empty) {
      position: relative;
      aspect-ratio: 16 / 9;
      margin-top: 2rem;
      overflow: hidden;
      background: var(--choirStall);
    }
    #voicing-media iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: var(--choirStall);
    }
    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .88; /* settles the thumbnail toward the parchment register */
    }
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 68px;
      height: 48px;
      transform: translate(-50%, -50%);
      transition: opacity .2s;
    }
    .video-thumb:hover .play-btn,
    .video-thumb:focus-visible .play-btn { opacity: .85; }
    /* The media frame clips overflow, so the global offset outline would be
       invisible here — draw the focus ring inside the frame instead. */
    .video-thumb:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 3px var(--parchmentLight);
    }
    #voicing-media:empty + .pe-media-caption { display: none; }
    .pe-media-caption { margin-top: .75rem; }

    /* ── Venues list ── */
    .pe-venues {
      list-style: none; /* role="list" in the markup keeps AT list semantics */
      margin-top: 1rem;
      columns: 2;
      column-gap: 2.5rem;
    }
    @media (max-width: 40rem) {
      .pe-venues { columns: 1; }
    }
    .pe-venues li {
      font-family: var(--font-display);
      font-size: 1.375rem;
      line-height: 1.4;
      padding-block: .45rem;
      border-bottom: 1px solid var(--limestone);
      break-inside: avoid;
    }

    /* ── Process: the page's only numbered component ── */
    .pe-process {
      list-style: none; /* role="list" in the markup keeps AT list semantics */
      margin-top: 1.75rem;
      display: grid;
      gap: 2rem;
    }
    .pe-process li {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      column-gap: 1.25rem;
    }
    .pe-process .n {
      grid-row: span 2;
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 300;
      line-height: 1;
      color: var(--organPipe);
    }
    .pe-process h3 { margin: 0 0 .35rem; }
    .pe-process p { grid-column: 2; }

    /* ── Form ── */
    .pe-form { margin-top: 2.25rem; }
    .pe-field { margin-top: 1.75rem; }
    .pe-field > label,
    .pe-check-label span {
      display: block;
      font-family: var(--font-ui);
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--organPipe);
      margin-bottom: .5rem;
    }
    .pe-field input[type="text"],
    .pe-field input[type="email"],
    .pe-field input[type="tel"],
    .pe-field input[type="date"],
    .pe-field select,
    .pe-field textarea {
      display: block;
      width: 100%;
      font-family: var(--font-ui);
      font-size: 1rem;
      color: var(--choirStall);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--organPipe);
      border-radius: 0;
      padding: .55rem 0;
    }
    .pe-field textarea {
      border: 1px solid var(--organPipe);
      padding: .75rem;
      resize: vertical;
    }
    .pe-field input:focus,
    .pe-field select:focus,
    .pe-field textarea:focus {
      border-color: var(--choirStall);
    }
    /* Invalid state appears only after the user has interacted (site
       feedback red, not the decorative cassock red). */
    .pe-field input:user-invalid,
    .pe-field select:user-invalid,
    .pe-field textarea:user-invalid {
      border-color: #9B2C2C;
    }
    .pe-field input:disabled,
    .pe-field select:disabled,
    .pe-field textarea:disabled {
      color: var(--organPipe);
      border-bottom-style: dotted;
    }
    .pe-check-label {
      display: flex;
      align-items: baseline;
      gap: .6rem;
      margin-top: .9rem;
      cursor: pointer;
    }
    .pe-check-label span { margin-bottom: 0; }
    .pe-check-label input { accent-color: var(--cassockRed); }
    .pe-form .pe-btn { margin-top: 2.25rem; }
    .pe-form .pe-btn:disabled { cursor: default; opacity: .6; }

    /* ── Error / success (site feedback colours) ── */
    .pe-form-error {
      display: none;
      margin-top: 1.75rem;
      padding: 1rem 1.25rem;
      color: #9B2C2C;
      background: #FBEBE9;
      border: 1px solid #E0A8A8;
    }
    .pe-form-error[data-visible="true"] { display: block; }
    .h-captcha { margin-top: 2rem; }
    #pe-form-success {
      margin-top: 2.25rem;
      padding: 1rem 1.25rem;
      color: #2D5016;
      background: #E8F0E4;
      border: 1px solid #A8C99B;
    }
    #pe-form-success[hidden] { display: none; }

    /* ── Footer ── */
    .pe-footer {
      background: var(--parchment);
      border-top: 1px solid var(--limestone);
      padding: 3rem clamp(1.25rem, 5vw, 3rem);
      text-align: center;
      font-size: .875rem;
      color: var(--organPipe);
    }
    .pe-footer a { color: var(--organPipe); }
    .pe-footer p + p { margin-top: .75rem; }

    /* ── Focus & utilities ── */
    :focus-visible {
      outline: 2px solid var(--cassockRed);
      outline-offset: 3px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Motion: every opacity-0/entrance rule lives here, inside the
       no-preference query AND scoped under html.pe-motion (set by JS),
       so reduced-motion users and no-JS visitors see the full page. ── */
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      html.pe-motion .pe-hero__inner > :not(.pe-hairline--candle) {
        opacity: 0;
        animation: pe-rise 600ms cubic-bezier(.2, .6, .2, 1) forwards;
      }
      html.pe-motion .pe-hero__inner > .pe-hairline--candle {
        transform: scaleX(0);
        transform-origin: left;
        animation: pe-draw 900ms ease 200ms forwards;
      }
      /* The :not() in the shared rule counts toward specificity, so this
         override must repeat it to win — the CTA rises last. */
      html.pe-motion .pe-hero__inner > :not(.pe-hairline--candle).pe-hero__cta {
        animation-delay: 700ms;
      }
      html.pe-motion [data-fade] {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity .25s ease, transform .25s ease;
      }
      html.pe-motion [data-fade].pe-in {
        opacity: 1;
        transform: none;
      }
      @keyframes pe-rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pe-draw {
        to { transform: scaleX(1); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .pe-btn, .play-btn { transition: none; }
    }
    /* ── Skip link and print (parity with the main site) ── */
    .skip-link {
      position: absolute;
      top: -3rem;
      left: 1.25rem;
      padding: .5rem 1rem;
      background: var(--cassockRed);
      color: var(--parchment);
      font-family: var(--font-ui);
      font-size: .875rem;
      text-decoration: none;
      z-index: 200;
    }
    .skip-link:focus { top: .5rem; outline: 2px solid var(--choirStall); outline-offset: 2px; }
    @media print {
      body { background: #fff; color: #000; }
      .pe-nav-enquire, .pe-form, .skip-link, .video-embed { display: none !important; }
      [data-fade] { opacity: 1 !important; transform: none !important; }
      .pe-section { padding-block: 1.25rem; break-inside: avoid; }
      a { color: #000; }
      h1, h2, h3 { break-after: avoid; }
    }
  </style>
